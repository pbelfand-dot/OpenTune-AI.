name: CI

# Runs once per PR update (not on both push and pull_request). Standard runners
# are free on public repos. If the repo goes private again (GitHub Free: 2,000
# minutes/month, macOS billed at 10x), drop the macOS 3.10 job to save minutes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu is pinned: GitHub moves ubuntu-latest to Ubuntu 26 from 2026-10-19,
        # which could rename the Qt system packages installed below.
        os: [ubuntu-24.04, macos-latest]
        python: ["3.10", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest -q
      - name: CLI self-test
        run: opentune selftest
