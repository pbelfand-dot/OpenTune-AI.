name: CI

# Runs once per PR update (not on both push and pull_request). Standard runners
# are free on public repos. If the repo goes private again (GitHub Free: 2,000
# minutes/month, macOS billed at 10x), drop the macOS 3.10 job to save minutes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu is pinned: GitHub moves ubuntu-latest to Ubuntu 26 from 2026-10-19,
        # which could rename the Qt system packages installed below.
        os: [ubuntu-24.04, macos-latest]
        python: ["3.10", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tests (no car, no adapter, no display, no network)
        run: pytest -q
      - name: CLI self-test
        run: opentune selftest
      - name: Lab self-test
        run: opentune-lab selftest

  frontend:
    name: Browser UI (type-check, build, bundle up to date)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Type-check and build
        working-directory: web
        run: npm run build
      - name: Committed bundle matches the sources
        run: git diff --exit-code -- src/opentune/lab/web/dist || (echo "::error::Run 'cd web && npm run build' and commit src/opentune/lab/web/dist" && exit 1)

  docker:
    name: Docker image (headless lab)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t opentune-lab:ci .
      - name: Smoke test
        run: |
          docker run -d --name lab -p 127.0.0.1:8765:8765 opentune-lab:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8765/api/system | python3 -c "import json,sys; s=json.load(sys.stdin); assert s['safety']['real_ecu_write_enabled'] is False; print(s['lab_version'])"
          curl -sf http://127.0.0.1:8765/ | grep -q "OpenTune"
          docker exec lab opentune-lab selftest
          docker rm -f lab
